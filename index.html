<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>MISAEL - Catálogo Demo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #171717;
        background: #ffffff;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        background: #111111;
        color: #ffffff;
        border-bottom: 4px solid #f58220;
      }
      h1 {
        margin: 0;
        font-size: 21px;
      }
      .marca {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .logo-misael {
        display: none;
        width: min(170px, 44vw);
        height: 50px;
        object-fit: contain;
        object-position: left center;
        background: #ffffff;
        border-radius: 2px;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 390px;
        min-height: calc(100vh - 60px);
      }
      .catalogo {
        padding: 16px;
      }
      .buscador {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }
      input, select, textarea, button {
        font: inherit;
      }
      input, select, textarea {
        width: 100%;
        border: 1px solid #d8d8d8;
        border-radius: 6px;
        padding: 10px;
        background: #ffffff;
      }
      textarea {
        min-height: 74px;
        resize: vertical;
      }
      .productos {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .producto {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr) 320px;
        gap: 14px;
        align-items: center;
        border: 1px solid #dedede;
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
      }
      .foto {
        width: 120px;
        height: 120px;
        border: 1px solid #eeeeee;
        border-radius: 6px;
        object-fit: contain;
        background: #ffffff;
      }
      .sin-foto {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888888;
        font-size: 12px;
      }
      .producto h2 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .detalle {
        color: #666666;
        font-size: 13px;
        line-height: 1.35;
      }
      .precio {
        margin-top: 8px;
        font-weight: 700;
      }
      .controles {
        display: grid;
        grid-template-columns: 1fr 82px;
        gap: 8px;
        margin-top: 10px;
      }
      .controles.sin-sabor {
        grid-template-columns: 82px 1fr;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        background: #f58220;
        color: #111111;
        font-weight: 700;
        cursor: pointer;
      }
      button.secundario {
        background: #eeeeee;
      }
      button.eliminar {
        background: transparent;
        color: #b00020;
        padding: 0;
        font-size: 18px;
      }
      aside {
        padding: 16px;
        background: #f6f6f6;
        border-left: 1px solid #dddddd;
      }
      .panel {
        background: #ffffff;
        border: 1px solid #dddddd;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .panel h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #555555;
        font-size: 13px;
      }
      .campo {
        margin-bottom: 10px;
      }
      .item-carrito {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 58px 24px;
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid #dddddd;
      }
      .item-carrito:last-child {
        border-bottom: 0;
      }
      .item-titulo {
        font-weight: 700;
      }
      .total {
        display: flex;
        justify-content: space-between;
        border-top: 2px solid #111111;
        padding-top: 12px;
        font-size: 18px;
        font-weight: 700;
      }
      .total.detalle-total {
        border-top: 0;
        padding-top: 6px;
        font-size: 14px;
        font-weight: 400;
      }
      .total.descuento {
        color: #0a7a35;
      }
      .escala-aplicada {
        margin-top: 8px;
        padding: 8px;
        border-radius: 6px;
        background: #fafafa;
        color: #333333;
        font-size: 13px;
        line-height: 1.35;
      }
      .estado {
        margin-top: 10px;
        font-weight: 700;
      }
      .info-pago,
      .info-retiro {
        border: 1px solid #dddddd;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 10px;
        background: #fafafa;
        color: #333333;
        font-size: 13px;
        line-height: 1.45;
      }
      .resumen-linea {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px solid #eeeeee;
      }
      .resumen-linea:last-child {
        border-bottom: 0;
      }
      .resumen-producto {
        padding: 8px 0;
        border-bottom: 1px solid #eeeeee;
      }
      .resumen-producto:last-child {
        border-bottom: 0;
      }
      .acciones-resumen {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .oculto {
        display: none;
      }
      .error {
        color: #b00020;
      }
      .ok {
        color: #0a7a35;
      }
      .advertencia {
        color: #8a5700;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
        aside {
          border-left: 0;
          border-top: 1px solid #dddddd;
        }
        .producto {
          grid-template-columns: 88px minmax(0, 1fr);
        }
        .foto {
          width: 88px;
          height: 88px;
        }
        .acciones-producto {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>

    <main>
      <section class="catalogo">
        <div class="buscador">
          <input id="buscar" type="search" placeholder="Buscar producto o codigo">
          <button class="secundario" onclick="limpiarBusqueda()">Ver todo</button>
        </div>
        <div id="productos" class="productos">
          <div class="detalle">Cargando catalogo...</div>
        </div>
      </section>

      <aside>
        <div class="panel">
          <h2>Datos del cliente</h2>
          <div class="campo">
            <label>Nombre completo:</label>
            <input id="nombre">
          </div>
          <div class="campo">
            <label>DNI:</label>
            <input id="dni" inputmode="numeric" pattern="[0-9]*">
          </div>
          <div class="campo">
            <label>Telefono de contacto:</label>
            <input id="whatsapp" inputmode="tel" pattern="[0-9+]*">
          </div>
          <div class="campo">
            <label>Forma de pago</label>
            <select id="pago">
              <option value="">Seleccionar</option>
              <option>Transferencia</option>
              <option>Efectivo al retirar</option>
            </select>
          </div>
          <div id="infoPago" class="info-pago oculto"></div>
          <div id="infoRetiro" class="info-retiro oculto">
            <strong>Retiro en local:</strong><br>
            A coordinar
          </div>
          <div class="campo">
            <label>Observaciones</label>
            <textarea id="observaciones"></textarea>
          </div>
        </div>

        <div class="panel">
          <h2>Pedido</h2>
          <div id="carrito" class="detalle">Todavia no agregaste productos.</div>
          <div class="total">
            <span>Subtotal</span>
            <span id="subtotalCarrito">$ 0</span>
          </div>
          <div id="escalaCarrito" class="escala-aplicada oculto"></div>
          <div class="total detalle-total descuento">
            <span>Descuento</span>
            <span id="descuentoCarrito">-$ 0</span>
          </div>
          <div class="total">
            <span>TOTAL</span>
            <span id="totalCarrito">$ 0</span>
          </div>
        </div>

        <div id="resumenPanel" class="panel oculto">
          <h2>Revisar pedido</h2>
          <div id="resumenPedido" class="detalle"></div>
          <div class="acciones-resumen">
            <button class="secundario" onclick="editarPedido()">Editar pedido</button>
            <button id="botonConfirmar" onclick="confirmarPedido()">Confirmar pedido</button>
          </div>
        </div>

        <button id="botonRevisar" style="width:100%" onclick="enviar()">Revisar pedido</button>
        <div id="estado" class="estado"></div>
      </aside>

      async function iniciar() {
        const contenedor = document.getElementById('productos');
        contenedor.innerHTML = '<div class="detalle">Cargando catálogo...</div>';
        actualizarBotonConfirmar(true, 'Cargando catálogo...');

        try {
          const respuesta = await solicitarJsonp('catalogo');
          if (!respuesta || respuesta.ok !== true || !Array.isArray(respuesta.productos)) {
            throw new Error('Respuesta de catálogo inválida.');
          }

          productos = normalizarProductosPublicos(respuesta.productos);
          whatsappConfigurado = Boolean(
            respuesta.capacidades && respuesta.capacidades.whatsappConfigurado
          );
          renderProductos();
          mostrarInfoPago();

          envioPendiente = recuperarEnvioPendiente();
          if (envioPendiente) {
            restaurarPedidoEnInterfaz(envioPendiente.pedido);
            mostrarEstadoPersistente('Hay un pedido pendiente de confirmación. Consultando su estado...', 'advertencia');
            actualizarBotonConfirmar(true, 'Consultando pedido...');
            iniciarConsultaEstado(envioPendiente);
          } else {
            actualizarBotonConfirmar(false, 'Confirmar pedido');
          }
        } catch (error) {
          productos = [];
          whatsappConfigurado = false;
          contenedor.innerHTML = '<div class="detalle error">No pudimos cargar el catálogo. Intentá nuevamente en unos minutos.</div>';
          mostrarEstadoPersistente('La API del catálogo no respondió. Recargá la página para volver a intentar.', 'error');
          actualizarBotonConfirmar(true, 'Catálogo no disponible');
        }
      }

      function normalizarProductosPublicos(datos) {
        return datos.map(producto => ({
          codigo: String(producto.codigo || '').trim(),
          nombre: String(producto.nombre || '').trim(),
          presentacion: String(producto.presentacion || '').trim(),
          precioReferencia: Number(producto.precioReferencia || 0),
          precioMayor500K: Number(producto.precioMayor500K || 0),
          precioMayor1500K: Number(producto.precioMayor1500K || 0),
          precioMayor3M: Number(producto.precioMayor3M || 0),
          sabores: Array.isArray(producto.sabores)
            ? producto.sabores.map(sabor => String(sabor || '').trim()).filter(Boolean)
            : [],
          imagen: /^https:\/\//i.test(String(producto.imagen || '').trim())
            ? String(producto.imagen).trim()
            : ''
        })).filter(producto => producto.codigo && producto.nombre);
      }

      function esCallbackJsonpValido(nombre) {
        return /^[A-Za-z_$][0-9A-Za-z_$]{0,63}$/.test(String(nombre || ''));
      }

      function crearNombreCallbackJsonp() {
        const sufijo = Math.floor(Math.random() * 0x100000000).toString(16);
        return `misaelJsonp_${Date.now()}_${sufijo}`;
      }

      function solicitarJsonp(accion, parametros = {}, timeoutMs = JSONP_TIMEOUT_MS) {
        return new Promise((resolve, reject) => {
          const callback = crearNombreCallbackJsonp();
          if (!esCallbackJsonpValido(callback)) {
            reject(new Error('Callback JSONP inválido.'));
            return;
          }

          const script = document.createElement('script');
          const url = new URL(API_URL);
          let terminado = false;
          let temporizador = null;

          const limpiar = () => {
            if (temporizador) clearTimeout(temporizador);
            script.remove();
            try {
              delete window[callback];
            } catch (error) {
              window[callback] = undefined;
            }
          };

          const finalizar = (operacion, valor) => {
            if (terminado) return;
            terminado = true;
            limpiar();
            operacion(valor);
          };

          window[callback] = datos => finalizar(resolve, datos);
          script.async = true;
          script.onerror = () => finalizar(reject, new Error('No se pudo contactar la API.'));

          url.searchParams.set('accion', accion);
          Object.entries(parametros).forEach(([clave, valor]) => {
            url.searchParams.set(clave, String(valor));
          });
          url.searchParams.set('callback', callback);
          script.src = url.toString();

          temporizador = setTimeout(
            () => finalizar(reject, new Error('La API demoró demasiado en responder.')),
            timeoutMs
          );
          document.head.appendChild(script);
        });
      }

      function renderProductos() {
        const contenedor = document.getElementById('productos');
        const texto = document.getElementById('buscar').value.trim().toLowerCase();

        if (!productos.length) {
          contenedor.innerHTML = '<div class="detalle error">No se encontraron productos. Revisar que haya codigos en B, productos en C y precio de referencia en J desde la fila 6.</div>';
          return;
        }

        const filtrados = productos.filter(producto => {
          return !texto ||
            producto.codigo.toLowerCase().includes(texto) ||
            producto.nombre.toLowerCase().includes(texto) ||
            producto.presentacion.toLowerCase().includes(texto);
        });

        if (!filtrados.length) {
          contenedor.innerHTML = '<div class="detalle">No hay resultados. Toca "Ver todo" para volver al catalogo completo.</div>';
          return;
        }

        contenedor.innerHTML = filtrados.map(producto => {
          const tieneSabores = producto.sabores.length > 0;
          const imagenUrl = producto.imagen || IMAGENES_LOCALES[producto.codigo] || '';
          const imagen = imagenUrl
            ? `<img class="foto" src="${esc(imagenUrl)}" alt="${esc(producto.nombre)}">`
            : '<div class="foto sin-foto">Sin imagen</div>';
          const saborHtml = tieneSabores
            ? `<select id="sabor-${producto.codigo}">
                <option value="">Sabor</option>
                ${producto.sabores.map(sabor => `<option>${esc(sabor)}</option>`).join('')}
              </select>`
            : '';
          const controlesClase = tieneSabores ? 'controles' : 'controles sin-sabor';

          return `
            <article class="producto">
              ${imagen}
              <div>
                <h2>${esc(producto.nombre)}</h2>
                <div class="detalle">Cod. ${esc(producto.codigo)} | ${esc(producto.presentacion || '-')}</div>
                <div class="precio">Precio ref.: ${moneda(producto.precioReferencia)}</div>
                <div class="detalle">&gt; $500.000 hasta $1.500.000: ${moneda(producto.precioMayor500K)}</div>
                <div class="detalle">&gt; $1.500.000 hasta $3.000.000: ${moneda(producto.precioMayor1500K)}</div>
                <div class="detalle">&gt; $3.000.000: ${moneda(producto.precioMayor3M)}</div>
              </div>
              <div class="acciones-producto">
                <div class="${controlesClase}">
                  ${saborHtml}
                  <input id="cantidad-${producto.codigo}" type="number" min="1" value="1">
                </div>
                <button style="width:100%; margin-top:8px" onclick="agregar('${producto.codigo}')">Agregar</button>
              </div>
            </article>
          `;
        }).join('');
      }

      function agregar(codigo) {
        if (edicionBloqueadaPorPedidoPendiente()) return;
        const producto = productos.find(p => p.codigo === codigo);
        const cantidad = Number(document.getElementById('cantidad-' + codigo).value || 1);
        const saborControl = document.getElementById('sabor-' + codigo);
        const sabor = saborControl ? saborControl.value : '';

        if (producto.sabores.length && !sabor) {
          alert('Elegir sabor para ' + producto.nombre + '.');
          return;
        }

        const existente = carrito.find(item => item.codigo === codigo && item.sabor === sabor);
        if (existente) {
          existente.cantidad += cantidad;
        } else {
          carrito.push({ codigo, sabor, cantidad });
        }

        renderCarrito();
      }

      function renderCarrito() {
        const contenedor = document.getElementById('carrito');
        const pedidoCalculado = carritoConPrecios();
        const items = pedidoCalculado.items;

        if (!items.length) {
          contenedor.innerHTML = 'Todavia no agregaste productos.';
        } else {
          contenedor.innerHTML = items.map((item, index) => `
            <div class="item-carrito">
              <div>
                <div class="item-titulo">${esc(item.producto.nombre)}</div>
                <div>${esc(item.producto.presentacion || '-')} ${item.sabor ? '| ' + esc(item.sabor) : ''}</div>
                <div>${moneda(item.precioReferencia)} c/u ref. | ${moneda(item.subtotalReferencia)}</div>
                <div>Valor aplicado: ${moneda(item.precioUnitario)} c/u</div>
              </div>
              <input type="number" min="1" value="${item.cantidad}" oninput="cambiarCantidad(${index}, this.value)" onchange="cambiarCantidad(${index}, this.value)">
              <button class="eliminar" onclick="quitar(${index})">x</button>
            </div>
          `).join('');
        }

        const cantidad = carrito.reduce((suma, item) => suma + item.cantidad, 0);
        document.getElementById('subtotalCarrito').textContent = moneda(pedidoCalculado.subtotalReferencia);
        document.getElementById('descuentoCarrito').textContent = '-' + moneda(pedidoCalculado.descuento);
        document.getElementById('totalCarrito').textContent = moneda(pedidoCalculado.total);
        document.getElementById('totalHeader').textContent = moneda(pedidoCalculado.total);
        document.getElementById('cantidadHeader').textContent = cantidad + ' productos';
        const escala = document.getElementById('escalaCarrito');
        escala.classList.toggle('oculto', !items.length);
        escala.textContent = items.length ? descripcionEscala(pedidoCalculado.escala) : '';
        actualizarResumenSiVisible();
      }

      function carritoConPrecios() {
        const itemsBase = carrito.map(item => {
          const producto = productos.find(p => p.codigo === item.codigo);
          return {
            ...item,
            producto
          };
        });
        const subtotalReferencia = calcularSubtotalReferencia(itemsBase);
        const escala = obtenerEscalaPrecio(subtotalReferencia);

        const items = itemsBase.map(item => {
          const precioReferencia = item.producto.precioReferencia;
          const subtotalReferenciaItem = precioReferencia * item.cantidad;
          const precioUnitarioFinal = precioPorEscala(item.producto, escala);
          const subtotalFinal = precioUnitarioFinal * item.cantidad;

          return {
            ...item,
            precioReferencia,
            subtotalReferencia: subtotalReferenciaItem,
            precioUnitario: precioUnitarioFinal,
            subtotal: subtotalFinal
          };
        });
        const total = items.reduce((suma, item) => suma + item.subtotal, 0);

        return {
          items,
          escala,
          subtotalReferencia,
          descuento: subtotalReferencia - total,
          total
        };
      }

      function calcularSubtotalReferencia(items) {
        return items.reduce((suma, item) => {
          return suma + item.producto.precioReferencia * item.cantidad;
        }, 0);
      }

      function obtenerEscalaPrecio(subtotalReferencia) {
        if (subtotalReferencia > 3000000) return 'mayor3M';
        if (subtotalReferencia > 1500000) return 'mayor1500K';
        if (subtotalReferencia > 500000) return 'mayor500K';
        return 'referencia';
      }

      function precioPorEscala(producto, escala) {
        if (escala === 'mayor3M') return producto.precioMayor3M || producto.precioReferencia;
        if (escala === 'mayor1500K') return producto.precioMayor1500K || producto.precioReferencia;
        if (escala === 'mayor500K') return producto.precioMayor500K || producto.precioReferencia;
        return producto.precioReferencia;
      }

      function descripcionEscala(escala) {
        if (escala === 'mayor3M') return 'Escala aplicada: > $3.000.000';
        if (escala === 'mayor1500K') return 'Escala aplicada: > $1.500.000 hasta $3.000.000';
        if (escala === 'mayor500K') return 'Escala aplicada: > $500.000 hasta $1.500.000';
        return 'Escala aplicada: precio de referencia hasta $500.000';
      }

      function cambiarCantidad(index, valor) {
        if (edicionBloqueadaPorPedidoPendiente()) {
          renderCarrito();
          return;
        }
        carrito[index].cantidad = Math.max(1, Number(valor || 1));
        renderCarrito();
      }

      function quitar(index) {
        if (edicionBloqueadaPorPedidoPendiente()) return;
        carrito.splice(index, 1);
        renderCarrito();
      }

      function enviar() {
        if (edicionBloqueadaPorPedidoPendiente()) return;
        const pedido = armarPedidoDesdeFormulario();
        const error = validarPedidoCliente(pedido);
        if (error) {
          mostrarError(error);
          return;
        }

        renderResumen(pedido);
        document.getElementById('resumenPanel').classList.remove('oculto');
        limpiarEstado();
      }

      function confirmarPedido() {
        if (envioPendiente) {
          enviarPedidoPendiente(envioPendiente);
          return;
        }

        const pedido = armarPedidoDesdeFormulario();
        const error = validarPedidoCliente(pedido);
        if (error) {
          mostrarError(error);
          return;
        }

        try {
          envioPendiente = crearEnvioPendiente(pedido);
          if (!guardarEnvioPendiente(envioPendiente)) {
            throw new Error('No se pudo usar sessionStorage.');
          }
          enviarPedidoPendiente(envioPendiente);
        } catch (error) {
          envioPendiente = null;
          mostrarEstadoPersistente('Este navegador no pudo preparar el envío seguro. Recargá la página e intentá nuevamente.', 'error');
          actualizarBotonConfirmar(false, 'Confirmar pedido');
        }
      }

      function generarUuidV4() {
        if (crypto.randomUUID) return crypto.randomUUID().toLowerCase();

        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;
        const hexadecimal = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
        return `${hexadecimal.slice(0, 8)}-${hexadecimal.slice(8, 12)}-${hexadecimal.slice(12, 16)}-${hexadecimal.slice(16, 20)}-${hexadecimal.slice(20)}`;
      }

      function generarTokenHexadecimal() {
        const bytes = new Uint8Array(32);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
      }

      function crearEnvioPendiente(pedido) {
        return {
          requestId: `req-${generarUuidV4()}`,
          token: generarTokenHexadecimal(),
          idempotencyKey: generarUuidV4(),
          pedido: JSON.parse(JSON.stringify(pedido)),
          creadoEn: Date.now()
        };
      }

      function construirCuerpoPost(pendiente) {
        return {
          accion: 'enviarPedido',
          requestId: pendiente.requestId,
          token: pendiente.token,
          idempotencyKey: pendiente.idempotencyKey,
          pedido: pendiente.pedido
        };
      }

      function esUuidV4Valido(valor) {
        return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(String(valor || ''));
      }

      function esEnvioPendienteValido(pendiente) {
        return Boolean(
          pendiente &&
          /^req-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(String(pendiente.requestId || '')) &&
          /^[0-9a-f]{64}$/.test(String(pendiente.token || '')) &&
          esUuidV4Valido(pendiente.idempotencyKey) &&
          pendiente.pedido &&
          pendiente.pedido.cliente &&
          Array.isArray(pendiente.pedido.items)
        );
      }

      function guardarEnvioPendiente(pendiente) {
        try {
          sessionStorage.setItem(PENDIENTE_STORAGE_KEY, JSON.stringify(pendiente));
          return true;
        } catch (error) {
          return false;
        }
      }

      function recuperarEnvioPendiente() {
        try {
          const guardado = sessionStorage.getItem(PENDIENTE_STORAGE_KEY);
          if (!guardado) return null;
          const pendiente = JSON.parse(guardado);
          if (!esEnvioPendienteValido(pendiente)) {
            sessionStorage.removeItem(PENDIENTE_STORAGE_KEY);
            return null;
          }
          return pendiente;
        } catch (error) {
          try {
            sessionStorage.removeItem(PENDIENTE_STORAGE_KEY);
          } catch (storageError) {
            // No hay almacenamiento de sesión disponible para limpiar.
          }
          return null;
        }
      }

      function eliminarEnvioPendiente() {
        try {
          sessionStorage.removeItem(PENDIENTE_STORAGE_KEY);
        } catch (error) {
          // El envío igualmente se limpia de la memoria de esta página.
        }
        envioPendiente = null;
      }

      function restaurarPedidoEnInterfaz(pedido) {
        carrito = JSON.parse(JSON.stringify(pedido.items || []));
        document.getElementById('nombre').value = pedido.cliente.nombre || '';
        document.getElementById('dni').value = pedido.cliente.dni || '';
        document.getElementById('whatsapp').value = pedido.cliente.whatsapp || '';
        document.getElementById('pago').value = pedido.cliente.pago || '';
        document.getElementById('observaciones').value = pedido.cliente.observaciones || '';
        renderCarrito();
        renderResumen(pedido);
        document.getElementById('resumenPanel').classList.remove('oculto');
      }

      function edicionBloqueadaPorPedidoPendiente() {
        if (!envioPendiente) return false;
        mostrarEstadoPersistente('Hay un pedido pendiente. Usá el mismo envío para evitar duplicados.', 'advertencia');
        actualizarBotonConfirmar(false, 'Reintentar envío');
        return true;
      }

      async function enviarPedidoPendiente(pendiente) {
        if (postEnCurso || !esEnvioPendienteValido(pendiente)) return;

        postEnCurso = true;
        if (!guardarEnvioPendiente(pendiente)) {
          postEnCurso = false;
          mostrarEstadoPersistente('No se pudo conservar el pedido pendiente en esta sesión. Recargá la página e intentá nuevamente.', 'error');
          actualizarBotonConfirmar(false, 'Confirmar pedido');
          return;
        }
        mostrarEstadoPersistente('Enviando pedido y esperando confirmación...', '');
        actualizarBotonConfirmar(true, 'Enviando...');
        iniciarConsultaEstado(pendiente);

        try {
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=UTF-8'
            },
            body: JSON.stringify(construirCuerpoPost(pendiente))
          });
        } catch (error) {
          detenerConsultaEstado();
          mostrarEstadoPersistente('No se pudo completar el envío. Podés reintentarlo sin duplicar el pedido.', 'error');
          actualizarBotonConfirmar(false, 'Reintentar envío');
        } finally {
          postEnCurso = false;
        }
      }

      function iniciarConsultaEstado(pendiente) {
        detenerConsultaEstado();
        consultaEstadoInicio = Date.now();
        erroresEstadoConsecutivos = 0;
        consultaEstadoTimer = setTimeout(
          () => consultarEstadoPendiente(pendiente),
          ESTADO_INTERVAL_MS
        );
      }

      function detenerConsultaEstado() {
        if (consultaEstadoTimer) clearTimeout(consultaEstadoTimer);
        consultaEstadoTimer = null;
      }

      function programarSiguienteConsulta(pendiente) {
        detenerConsultaEstado();
        consultaEstadoTimer = setTimeout(
          () => consultarEstadoPendiente(pendiente),
          ESTADO_INTERVAL_MS
        );
      }

      async function consultarEstadoPendiente(pendiente) {
        if (!envioPendiente || envioPendiente.requestId !== pendiente.requestId) return;

        const tiempoTranscurrido = Date.now() - consultaEstadoInicio;
        if (tiempoTranscurrido >= ESTADO_TIMEOUT_MS) {
          detenerConsultaEstado();
          mostrarEstadoPersistente('La confirmación está demorando. El pedido queda pendiente y puede reintentarse de forma segura.', 'advertencia');
          actualizarBotonConfirmar(false, 'Reintentar envío');
          return;
        }

        try {
          const respuesta = await solicitarJsonp('estado', {
            requestId: pendiente.requestId,
            token: pendiente.token
          });
          erroresEstadoConsecutivos = 0;

          if (respuesta && respuesta.estado === 'completado') {
            detenerConsultaEstado();
            eliminarEnvioPendiente();
            mostrarEstadoPersistente('Pedido confirmado correctamente. El comercio se comunicará para coordinar.', 'ok');
            actualizarBotonConfirmar(false, 'Confirmar pedido');
            reiniciarFormulario();
            return;
          }

          if (respuesta && respuesta.estado === 'error') {
            detenerConsultaEstado();
            eliminarEnvioPendiente();
            mostrarEstadoPersistente('El pedido no pudo completarse. Revisá los datos e intentá nuevamente.', 'error');
            actualizarBotonConfirmar(false, 'Confirmar pedido');
            return;
          }

          if (respuesta && (respuesta.estancado === true || respuesta.requiereRevision === true)) {
            detenerConsultaEstado();
            mostrarEstadoPersistente('El pedido requiere revisión. No se volverá a procesar automáticamente.', 'advertencia');
            actualizarBotonConfirmar(false, 'Reintentar envío');
            return;
          }

          programarSiguienteConsulta(pendiente);
        } catch (error) {
          erroresEstadoConsecutivos += 1;
          if (erroresEstadoConsecutivos >= 3) {
            detenerConsultaEstado();
            mostrarEstadoPersistente('No pudimos confirmar el estado. El pedido queda pendiente para un reintento seguro.', 'error');
            actualizarBotonConfirmar(false, 'Reintentar envío');
            return;
          }
          programarSiguienteConsulta(pendiente);
        }
      }

      function actualizarBotonConfirmar(deshabilitado, texto) {
        const boton = document.getElementById('botonConfirmar');
        boton.disabled = Boolean(deshabilitado);
        boton.textContent = texto;
      }

      function mostrarEstadoPersistente(mensaje, tipo) {
        if (estadoTimer) clearTimeout(estadoTimer);
        const estado = document.getElementById('estado');
        estado.className = `estado${tipo ? ' ' + tipo : ''}`;
        estado.textContent = mensaje;
      }

      function armarPedidoDesdeFormulario() {
        return {
          cliente: {
            nombre: document.getElementById('nombre').value.trim(),
            dni: document.getElementById('dni').value.trim(),
            localidad: '',
            whatsapp: document.getElementById('whatsapp').value.trim(),
            pago: document.getElementById('pago').value,
            entrega: DIRECCION_RETIRO,
            observaciones: document.getElementById('observaciones').value.trim()
          },
          items: carrito
        };
      }

      function validarPedidoCliente(pedido) {
        if (!pedido.cliente.nombre) return 'Falta completar Nombre completo.';
        if (!pedido.cliente.dni) return 'Falta completar DNI.';
        if (!/^[0-9]+$/.test(pedido.cliente.dni)) return 'DNI: usar solo numeros.';
        if (!pedido.cliente.whatsapp) return 'Falta completar Telefono de contacto.';
        if (!/^[0-9+]+$/.test(pedido.cliente.whatsapp)) return 'Telefono de contacto: usar solo numeros y el signo +.';
        if (!pedido.cliente.pago) return 'Falta elegir Forma de pago.';
        if (!pedido.items.length) return 'Agrega al menos un producto al pedido.';
        return '';
      }

      function renderResumen(pedido) {
        const pedidoCalculado = carritoConPrecios();
        const items = pedidoCalculado.items;
        const pagoExtra = pedido.cliente.pago === 'Transferencia'
          ? `<div class="info-pago">
              <strong>Datos para transferencia</strong><br>
              Titular: ${esc(DATOS_TRANSFERENCIA.titular)}<br>
              Cta: ${esc(DATOS_TRANSFERENCIA.cuenta)}<br>
              CBU: ${esc(DATOS_TRANSFERENCIA.cbu)}<br>
              Alias: ${esc(DATOS_TRANSFERENCIA.alias)}<br><br>
              <strong>Estimado/a:</strong><br>
              ${mensajeConfirmacionPedido()}
            </div>`
          : '<div class="info-pago">Pago al retirar en efectivo.</div>';

        const productosHtml = items.map(item => `
          <div class="resumen-producto">
            <strong>${esc(item.producto.nombre)}</strong><br>
            <span>${esc(item.producto.presentacion || '-')} ${item.sabor ? '| Sabor: ' + esc(item.sabor) : ''}</span><br>
            <span>Cantidad: ${item.cantidad} | Unitario ref.: ${moneda(item.precioReferencia)} | Subtotal ref.: ${moneda(item.subtotalReferencia)}</span><br>
            <span>Valor aplicado: ${moneda(item.precioUnitario)} c/u</span>
          </div>
        `).join('');

        document.getElementById('resumenPedido').innerHTML = `
          <div class="resumen-linea"><strong>Nombre completo</strong><span>${esc(pedido.cliente.nombre)}</span></div>
          <div class="resumen-linea"><strong>DNI</strong><span>${esc(pedido.cliente.dni)}</span></div>
          <div class="resumen-linea"><strong>Telefono</strong><span>${esc(pedido.cliente.whatsapp)}</span></div>
          <div class="resumen-linea"><strong>Forma de pago</strong><span>${esc(pedido.cliente.pago)}</span></div>
          <div class="resumen-linea"><strong>Retiro en local</strong><span>${esc(DIRECCION_RETIRO)}</span></div>
          ${pagoExtra}
          <h3>Productos</h3>
          ${productosHtml}
          <div class="total"><span>Subtotal</span><span>${moneda(pedidoCalculado.subtotalReferencia)}</span></div>
          <div class="escala-aplicada">${esc(descripcionEscala(pedidoCalculado.escala))}</div>
          <div class="total detalle-total descuento"><span>Descuento</span><span>-${moneda(pedidoCalculado.descuento)}</span></div>
          <div class="total"><span>TOTAL</span><span>${moneda(pedidoCalculado.total)}</span></div>
        `;
      }

      function editarPedido() {
        if (edicionBloqueadaPorPedidoPendiente()) return;
        document.getElementById('resumenPanel').classList.add('oculto');
        limpiarEstado();
      }

      function actualizarResumenSiVisible() {
        const panel = document.getElementById('resumenPanel');
        if (!panel.classList.contains('oculto')) {
          renderResumen(armarPedidoDesdeFormulario());
        }
      }

      function reiniciarFormulario() {
        carrito = [];
        document.getElementById('nombre').value = '';
        document.getElementById('dni').value = '';
        document.getElementById('whatsapp').value = '';
        document.getElementById('pago').value = '';
        document.getElementById('observaciones').value = '';
        document.getElementById('buscar').value = '';
        document.getElementById('resumenPedido').innerHTML = '';
        document.getElementById('resumenPanel').classList.add('oculto');
        mostrarInfoPago();
        renderCarrito();
        renderProductos();
      }

      function limpiarBusqueda() {
        document.getElementById('buscar').value = '';
        renderProductos();
      }

      function mostrarInfoPago() {
        const pago = document.getElementById('pago').value;
        const info = document.getElementById('infoPago');
        const retiro = document.getElementById('infoRetiro');

        info.classList.add('oculto');
        retiro.classList.add('oculto');
        info.innerHTML = '';

        if (pago === 'Transferencia') {
          info.classList.remove('oculto');
          info.innerHTML = `
            <strong>Datos para transferencia</strong><br>
            Titular: ${esc(DATOS_TRANSFERENCIA.titular)}<br>
            Cta: ${esc(DATOS_TRANSFERENCIA.cuenta)}<br>
            CBU: ${esc(DATOS_TRANSFERENCIA.cbu)}<br>
            Alias: ${esc(DATOS_TRANSFERENCIA.alias)}<br><br>
            <strong>Estimado/a:</strong><br>
            ${mensajeConfirmacionPedido()}
          `;
          return;
        }

        if (pago === 'Efectivo al retirar') {
          retiro.classList.remove('oculto');
          return;
        }
      }

      function mensajeConfirmacionPedido() {
        return whatsappConfigurado
          ? 'Por favor, env&iacute;enos el comprobante por WhatsApp para confirmar el pedido y proceder con su preparaci&oacute;n.'
          : 'El comercio se comunicar&aacute; para confirmar el pedido';
      }

      function mostrarError(mensaje) {
        document.getElementById('estado').className = 'estado error';
        document.getElementById('estado').textContent = mensaje;
        limpiarEstadoDespues();
      }

      function limpiarEstadoDespues() {
        clearTimeout(estadoTimer);
        estadoTimer = setTimeout(limpiarEstado, 3000);
      }

      function limpiarEstado() {
        clearTimeout(estadoTimer);
        document.getElementById('estado').className = 'estado';
        document.getElementById('estado').textContent = '';
      }

      function limitarCampo(id, permitidos) {
        const campo = document.getElementById(id);
        campo.addEventListener('input', () => {
          campo.value = campo.value.replace(permitidos, '');
        });
      }

      function moneda(valor) {
        return '$ ' + Number(valor || 0).toLocaleString('es-AR');
      }

      function esc(valor) {
        return String(valor || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function refrescarPedidoCadaSegundo() {
        if (carrito.length) {
          renderCarrito();
        }
      }

      document.getElementById('buscar').addEventListener('input', renderProductos);
      document.getElementById('pago').addEventListener('change', mostrarInfoPago);
      ['nombre', 'dni', 'whatsapp', 'pago', 'observaciones'].forEach(id => {
        document.getElementById(id).addEventListener('input', actualizarResumenSiVisible);
        document.getElementById(id).addEventListener('change', actualizarResumenSiVisible);
      });
      limitarCampo('dni', /[^0-9]/g);
      limitarCampo('whatsapp', /[^0-9+]/g);
      mostrarInfoPago();
      setInterval(refrescarPedidoCadaSegundo, 1000);
      iniciar();
    </script>
  </body>
</html>
